<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Estimate</title>
<style>
:root{--line:#bbb;--head:#eee;--sub:#f5f5f5;--danger:#b3261e;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:#fff;color:#222;font-family:Georgia,"DejaVu Serif",serif;padding:6px;max-width:960px;margin-inline:auto}
.hd{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:4px 0 6px}
.hd input{font:inherit;font-size:11px;border:0;border-bottom:1px solid var(--line);background:transparent;color:inherit;padding:4px 2px;min-width:0}
.hd .fl{font-weight:bold;font-size:13px;flex:1 1 100%}
.hd .ph{flex:1 1 40%}
h2{font-size:13px;margin:8px 0 3px;display:flex;gap:4px;align-items:center}
h2 input{font:inherit;font-weight:bold;border:0;background:transparent;color:inherit;flex:1;min-width:0}
table{border-collapse:collapse;width:100%;table-layout:fixed;font-size:10px}
th,td{border:1px solid var(--line);padding:0;text-align:left}
th{background:var(--head);padding:3px 2px;font-size:9.5px}
td.n{padding:3px 1px;font-size:9.5px}
td input{width:100%;box-sizing:border-box;border:0;background:transparent;color:inherit;font:inherit;padding:3px 2px;min-width:0;outline:0}
td input:focus{background:var(--sub);box-shadow:inset 0 0 0 2px #2a5db0}
td.x,th.x,col.x,h2 button.d{display:none}
tr.sub td{background:var(--sub);font-weight:bold;padding:3px 2px}
td.l{padding:3px 2px}
button{font:inherit;font-size:10px;border:1px solid var(--line);background:var(--head);color:#222;padding:3px 7px;border-radius:6px;cursor:pointer}
button.d{color:var(--danger);border:0;background:transparent;padding:2px 6px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.amt{text-align:right}
tr.tot td{font-size:11px;background:var(--head);font-weight:bold;padding:4px 2px}
.pdf{width:100%;padding:8px;font-size:12px;font-weight:bold;background:#222;color:#fff;border-color:#222;margin-top:14px}
@page{margin:12mm}
@media print{.noprint,.x{display:none!important}body{padding:0}}
.banner{display:block;width:100%;height:auto;margin:0 0 6px}
</style>
</head>

<div class="hd">
 <input class="fl" id="flat" placeholder="Flat no - (e.g. D 202)">
 <input class="ph" id="p1" placeholder="Phone 1" inputmode="tel">
 <input class="ph" id="p2" placeholder="Phone 2" inputmode="tel">
</div>
<div id="app"></div>
<div class="bar noprint"><button id="addRoom">+ Add room</button><button id="reset" class="d">Clear all</button></div>
<h2>Summary</h2>
<table><colgroup><col><col style="width:35%"></colgroup><tbody id="sum"></tbody></table>
<button class="pdf noprint" id="pdf">Create PDF</button>
<script>
const KEY='estimate-v3';
const T={std:[['item','Item',27],['size','Size',20],['sqft','Sqft',13],['rate','Rate',14],['amt','Amount (₹)',0]],
 kit:[['item','Item',30],['size','Size / units',22],['calc','Calculation',24],['amt','Amount (₹)',0]]};
const ER=()=>({item:'',size:'',sqft:'',rate:'',calc:'',amt:''});
const room=(name,type,n)=>({name,type,rows:Array.from({length:n},ER)});
let S=[room('Master room','std',6),room('Guest room','std',6),room('Living room','std',8),room('Kitchen','kit',5)];
let X=[{desc:'Painting',details:'',amt:''},{desc:'Electric',details:'',amt:''}];
let H={flat:'',p1:'',p2:''};
try{const j=JSON.parse(localStorage.getItem(KEY));if(j&&j.S){S=j.S;X=j.X;H=j.H}}catch(e){}
const num=v=>{const n=parseFloat(String(v).replace(/,/g,''));return isNaN(n)?0:n};
const fmt=n=>Math.round(n).toLocaleString('en-IN');
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({S,X,H}))}catch(e){}};
function auto(type,w){
 if(type==='std'){const s=num(w.sqft),r=num(w.rate);return(/^[\d.,\s]+$/.test(w.sqft)&&s&&r)?s*r:null}
 const p=w.calc.split(/[×xX*]/).map(a=>a.trim());
 return(p.length>1&&p.every(a=>/^[\d.,]+$/.test(a)))?p.reduce((a,b)=>a*num(b),1):null;
}
const inp=(a,v,cls)=>`<input ${cls?`class="${cls}" `:''}${a} value="${esc(v)}">`;
function render(){
 document.getElementById('app').innerHTML=S.map((r,ri)=>{
  const c=T[r.type];
  return `<section><h2><input data-r="${ri}" data-f="name" value="${esc(r.name)}"><button class="d noprint" data-dr="${ri}">✕</button></h2>
  <table><colgroup><col style="width:20px">${c.map(x=>`<col${x[2]?` style="width:${x[2]}%"`:''}>`).join('')}<col class="x" style="width:20px"></colgroup>
  <thead><tr><th>No.</th>${c.map(x=>`<th>${x[1]}</th>`).join('')}<th class="x"></th></tr></thead><tbody>
  ${r.rows.map((w,wi)=>`<tr><td class="n">${wi+1})</td>${c.map(x=>`<td>${inp(`data-r="${ri}" data-w="${wi}" data-f="${x[0]}" inputmode="${['sqft','rate','amt'].includes(x[0])?'decimal':'text'}"`,x[0]==='amt'&&w.amt?fmt(num(w.amt)):w[x[0]],x[0]==='amt'?'amt':'')}</td>`).join('')}
  <td class="x"><button class="d" data-d="${ri},${wi}">✕</button></td></tr>`).join('')}
  <tr class="sub"><td></td><td colspan="${c.length-1}" class="sl">${esc(r.name)} subtotal</td><td class="amt" id="st${ri}"></td><td class="x"></td></tr>
  </tbody></table><div class="bar noprint"><button data-a="${ri}">+ Add item</button><button data-rl="${ri}" style="color:#b3261e">− Remove last item</button><button data-dr="${ri}" style="color:#b3261e">Delete room</button></div></section>`}).join('')+
 `<section><h2>Other charges</h2><table><colgroup><col style="width:30%"><col style="width:40%"><col><col class="x" style="width:20px"></colgroup>
 <thead><tr><th>Description</th><th>Details</th><th>Amount (₹)</th><th class="x"></th></tr></thead><tbody>
 ${X.map((w,i)=>`<tr><td>${inp(`data-x="${i}" data-f="desc"`,w.desc)}</td><td>${inp(`data-x="${i}" data-f="details"`,w.details)}</td><td>${inp(`data-x="${i}" data-f="amt" inputmode="decimal"`,w.amt?fmt(num(w.amt)):'','amt')}</td><td class="x"><button class="d" data-dx="${i}">✕</button></td></tr>`).join('')}
 </tbody></table><div class="bar noprint"><button data-ax="1">+ Add charge</button><button data-rx="1" style="color:#b3261e">− Remove last charge</button></div></section>`;
 totals();
}
function totals(){
 let g=0,rows='';
 S.forEach((r,ri)=>{const t=r.rows.reduce((a,w)=>a+num(w.amt),0);g+=t;const e=document.getElementById('st'+ri);if(e)e.textContent=fmt(t);
  rows+=`<tr><td class="l">${esc(r.name)} subtotal</td><td class="l amt">₹${fmt(t)}</td></tr>`});
 X.forEach(w=>{const a=num(w.amt);g+=a;if(w.desc||a)rows+=`<tr><td class="l">${esc(w.desc)}</td><td class="l amt">₹${fmt(a)}</td></tr>`});
 rows+=`<tr class="tot"><td>TOTAL AMOUNT</td><td class="amt">₹${fmt(g)}</td></tr>`;
 document.getElementById('sum').innerHTML=rows;
}
document.addEventListener('input',e=>{
 const t=e.target,d=t.dataset;if(!d.f)return;
 if(d.x!==undefined){X[+d.x][d.f]=t.value}
 else{
  const r=S[+d.r];
  if(d.f==='name'){r.name=t.value;document.querySelectorAll('.sl').forEach((el,i)=>{el.textContent=S[i].name+' subtotal'})}
  else{
   const w=r.rows[+d.w];w[d.f]=t.value;
   if(d.f==='sqft'||d.f==='rate'||d.f==='calc'){const a=auto(r.type,w);if(a!==null){w.amt=String(Math.round(a));t.closest('tr').querySelector('[data-f=amt]').value=fmt(a)}}
  }
 }
 totals();save();
});
document.addEventListener('click',e=>{
 const d=e.target.dataset;
 if(d.a!==undefined)S[+d.a].rows.push(ER());
 else if(d.rl!==undefined){if(S[+d.rl].rows.length>1)S[+d.rl].rows.pop()}
 else if(d.d){const[a,b]=d.d.split(',').map(Number);S[a].rows.splice(b,1)}
 else if(d.dr!==undefined){if(!confirm('Delete this room?'))return;S.splice(+d.dr,1)}
 else if(d.ax)X.push({desc:'',details:'',amt:''});
 else if(d.rx)X.pop();
 else if(d.dx!==undefined)X.splice(+d.dx,1);
 else return;
 render();save();
});
document.getElementById('addRoom').onclick=()=>{S.push(room('New room','std',4));render();save()};
document.getElementById('reset').onclick=()=>{if(confirm('Clear everything?')){S=S.map(r=>room(r.name,r.type,r.rows.length));X=X.map(w=>({desc:w.desc,details:'',amt:''}));render();save()}};
document.getElementById('pdf').onclick=()=>window.print();
['flat','p1','p2'].forEach(id=>{const el=document.getElementById(id);el.value=H[id]||'';el.oninput=()=>{H[id]=el.value;save()}});
render();
</script>
</body>
</html>
